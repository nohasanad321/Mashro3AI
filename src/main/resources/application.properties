spring.application.name=mashro3ai
spring.profiles.default=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mashro3ai}
spring.datasource.username=${DB_USERNAME:mashro3ai}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.address=127.0.0.1
mashro3.ai.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
mashro3.ai.model=${OLLAMA_MODEL:qwen3:4b}
mashro3.ai.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
