services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mashro3ai
      POSTGRES_USER: mashro3ai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashro3ai -d mashro3ai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
